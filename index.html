<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Library</title>
    <style>
      :root {
        --bg: #17191f;
        --panel: #22252d;
        --panel2: #2b2f39;
        --text: #f1f3f5;
        --muted: #aeb4c0;
        --accent: #78a9ff;
        --border: #3a3f4a;
        --danger: #e07a7a;
        --ok: #86d89a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      body.drawer-open {
        overflow: hidden;
      }
      button,
      input {
        font: inherit;
      }
      button {
        color: var(--text);
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 13px;
        cursor: pointer;
      }
      button:hover {
        background: #353a45;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      header {
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
        background: #1d2027;
      }
      header > div,
      main {
        max-width: 1100px;
        margin: auto;
      }
      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 30px;
      }
      header p {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 15px;
      }
      .top-tab {
        background: var(--panel2);
      }
      main {
        padding: 24px;
      }
      .games-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 18px;
      }
      .game-card {
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .game-image {
        width: 100%;
        aspect-ratio: 16/9;
        display: grid;
        place-items: center;
        background: #111318;
        overflow: hidden;
      }
      .game-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .placeholder-image {
        font-size: 72px;
      }
      .game-content {
        padding: 17px;
        display: flex;
        flex-direction: column;
        flex: 1;
      }
      .game-content h2 {
        margin: 0;
        font-size: 20px;
      }
      .description {
        margin: 7px 0 15px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }
      .game-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 16px;
      }
      .meta-tag {
        padding: 4px 7px;
        color: var(--muted);
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 5px;
        font-size: 11px;
      }
      .play-button {
        width: 100%;
        margin-top: auto;
        color: #111318;
        background: var(--accent);
        border: 0;
        border-radius: 7px;
        padding: 10px 14px;
        font-weight: 700;
      }
      .drawer-backdrop {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(0, 0, 0, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s;
      }
      .drawer-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 21;
        width: min(480px, 100vw);
        background: var(--panel);
        border-left: 1px solid var(--border);
        transform: translateX(100%);
        transition: transform 0.2s ease;
        display: flex;
        flex-direction: column;
      }
      .drawer.open {
        transform: translateX(0);
      }
      .drawer-header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 18px;
        border-bottom: 1px solid var(--border);
      }
      .drawer-header h2 {
        margin: 0;
        font-size: 19px;
      }
      .drawer-header p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .drawer-body {
        padding: 18px;
        overflow: auto;
        flex: 1;
      }
      .drawer-footer {
        padding: 14px 18px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 10px;
      }
      .drawer-footer button {
        flex: 1;
      }
      .section {
        padding: 14px 0;
        border-bottom: 1px solid var(--border);
      }
      .section:first-child {
        padding-top: 0;
      }
      .section:last-child {
        border-bottom: 0;
      }
      .section h3 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .grow {
        flex: 1;
      }
      .profile-list,
      .players-list {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .profile-row,
      .player-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .avatar {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--bg);
        font-size: 20px;
        flex: 0 0 34px;
      }
      .player-info {
        min-width: 0;
      }
      .player-name {
        font-weight: 700;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .player-type {
        color: var(--muted);
        font-size: 11px;
      }
      .current {
        border-color: var(--accent);
      }
      .small {
        padding: 6px 9px;
        font-size: 12px;
      }
      .danger {
        color: #ffbcbc;
        border-color: #6b3d45;
      }
      .primary {
        background: var(--accent);
        color: #111318;
        border-color: transparent;
        font-weight: 700;
      }
      .online-box {
        background: #1b1e24;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 12px;
      }
      .online-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .online-code {
        margin-top: 10px;
        text-align: center;
        padding: 13px;
        border: 1px dashed var(--accent);
        border-radius: 8px;
        background: #1a2030;
      }
      .online-code strong {
        display: block;
        font-size: 30px;
        letter-spacing: 6px;
      }
      .online-code span {
        color: var(--muted);
        font-size: 11px;
      }
      .online-code[hidden] {
        display: none;
      }
      .join-row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .join-row input {
        flex: 1;
        min-width: 0;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 10px;
        text-align: center;
        letter-spacing: 3px;
      }
      .status-line {
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
      }
      .status-line.ok {
        color: var(--ok);
      }
      .error {
        margin-top: 9px;
        color: #ffb4b4;
        background: #321f24;
        border: 1px solid #63353d;
        border-radius: 7px;
        padding: 8px;
        font-size: 12px;
      }
      .error[hidden] {
        display: none;
      }
      .setup-players {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .setup-slot {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .seat {
        font-weight: 700;
        width: 52px;
      }
      .waiting {
        color: var(--muted);
        font-size: 12px;
      }
      @media (max-width: 650px) {
        main {
          padding: 14px;
        }
        .online-actions {
          grid-template-columns: 1fr;
        }
        .drawer {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div class="header-row">
          <div>
            <h1>Game Library</h1>
            <p>Standard Chess — local, computer, and online play</p>
          </div>
          <button id="playersButton" class="top-tab">
            Players &amp; Online
          </button>
        </div>
      </div>
    </header>
    <main><div id="gamesGrid" class="games-grid"></div></main>
    <div id="backdrop" class="drawer-backdrop"></div>
    <aside id="setupDrawer" class="drawer" aria-hidden="true">
      <div class="drawer-header">
        <div>
          <h2>Chess setup</h2>
          <p>Standard Chess</p>
        </div>
        <button id="closeSetup" class="small" aria-label="Close">×</button>
      </div>
      <div class="drawer-body">
        <section class="section">
          <h3>Players</h3>
          <div class="setup-players" id="setupPlayers"></div>
          <div class="muted" id="setupHint" style="margin-top: 9px"></div>
        </section>
        <section class="section">
          <h3>Online group</h3>
          <div class="online-box">
            <div class="online-actions">
              <button id="requestOnlineCode" class="primary">Create room</button
              ><button id="disconnectOnline">Disconnect</button>
            </div>
            <div id="onlineCodeDisplay" class="online-code" hidden>
              <span>ROOM CODE</span><strong id="onlineCode"></strong>
            </div>
            <div class="join-row">
              <input
                id="joinOnlineCode"
                inputmode="numeric"
                maxlength="4"
                placeholder="4-digit code"
                aria-label="Room code"
              /><button id="joinOnlineGroup" class="small">Join</button>
            </div>
            <div id="onlineCodeStatus" class="status-line">Not connected</div>
            <div
              id="onlineParticipants"
              class="players-list"
              style="margin-top: 10px"
            ></div>
            <div id="onlineError" class="error" hidden></div>
          </div>
        </section>
        <section class="section">
          <h3>Local profile</h3>
          <div class="muted" style="margin-bottom: 9px">
            The first profile on this device controls the local player.
          </div>
          <div id="profileList" class="profile-list"></div>
          <button
            id="addProfile"
            class="small"
            style="margin-top: 9px; width: 100%"
          >
            + Add profile
          </button>
          <div id="profileEditor"></div>
        </section>
      </div>
      <div class="drawer-footer">
        <button id="playButton" class="primary">Play</button>
      </div>
    </aside>
    <script>
      "use strict";
      const ONLINE_SERVER_URL = "opengamegallery.george-arps.workers.dev";
      const gamesGrid = document.getElementById("gamesGrid"),
        playersButton = document.getElementById("playersButton"),
        backdrop = document.getElementById("backdrop"),
        setupDrawer = document.getElementById("setupDrawer"),
        closeSetup = document.getElementById("closeSetup"),
        setupPlayers = document.getElementById("setupPlayers"),
        setupHint = document.getElementById("setupHint"),
        playButton = document.getElementById("playButton"),
        requestOnlineCodeButton = document.getElementById("requestOnlineCode"),
        disconnectOnlineButton = document.getElementById("disconnectOnline"),
        onlineCodeDisplay = document.getElementById("onlineCodeDisplay"),
        onlineCode = document.getElementById("onlineCode"),
        onlineCodeStatus = document.getElementById("onlineCodeStatus"),
        joinOnlineCode = document.getElementById("joinOnlineCode"),
        joinOnlineGroupButton = document.getElementById("joinOnlineGroup"),
        onlineParticipants = document.getElementById("onlineParticipants"),
        onlineError = document.getElementById("onlineError"),
        profileList = document.getElementById("profileList"),
        addProfileButton = document.getElementById("addProfile"),
        profileEditor = document.getElementById("profileEditor");
      let profiles = loadProfiles();
      let editingProfileId = null;
      const onlineState = {
        code: localStorage.getItem("gameLibraryOnlineCode") || "",
        hostToken: localStorage.getItem("gameLibraryOnlineHostToken") || "",
        clientId: localStorage.getItem("gameLibraryOnlineClientId") || "",
        joinedCode: localStorage.getItem("gameLibraryOnlineJoinedCode") || "",
        connected: false,
        isHost: false,
        socket: null,
        participants: [],
        config: null,
        pendingStart: null,
      };
      const AVATARS = [
        "♟",
        "♞",
        "♜",
        "♛",
        "♚",
        "⚔",
        "🎲",
        "★",
        "◆",
        "●",
        "▲",
        "■",
        "☀",
        "☾",
        "⚙",
        "🎮",
      ];
      function id() {
        return "p_" + Math.random().toString(36).slice(2, 10);
      }
      function loadProfiles() {
        try {
          const p = JSON.parse(
            localStorage.getItem("gameLibraryProfiles") || "null",
          );
          if (Array.isArray(p) && p.length) return p;
        } catch {}
        return [{ id: id(), name: "Player 1", avatar: "♟" }];
      }
      function saveProfiles() {
        localStorage.setItem("gameLibraryProfiles", JSON.stringify(profiles));
      }
      function configured() {
        return (
          ONLINE_SERVER_URL && !ONLINE_SERVER_URL.includes("YOUR-WORKER-URL")
        );
      }
      function roomCode() {
        return onlineState.code || onlineState.joinedCode || "";
      }
      function persistOnline() {
        localStorage.setItem("gameLibraryOnlineClientId", onlineState.clientId);
        if (onlineState.code)
          localStorage.setItem("gameLibraryOnlineCode", onlineState.code);
        else localStorage.removeItem("gameLibraryOnlineCode");
        if (onlineState.hostToken)
          localStorage.setItem(
            "gameLibraryOnlineHostToken",
            onlineState.hostToken,
          );
        else localStorage.removeItem("gameLibraryOnlineHostToken");
        if (onlineState.joinedCode)
          localStorage.setItem(
            "gameLibraryOnlineJoinedCode",
            onlineState.joinedCode,
          );
        else localStorage.removeItem("gameLibraryOnlineJoinedCode");
      }
      function error(msg = "") {
        onlineError.textContent = msg;
        onlineError.hidden = !msg;
      }
      function openSetup() {
        renderSetup();
        setupDrawer.classList.add("open");
        backdrop.classList.add("open");
        setupDrawer.setAttribute("aria-hidden", "false");
        document.body.classList.add("drawer-open");
      }
      function closeSetupDrawer() {
        setupDrawer.classList.remove("open");
        backdrop.classList.remove("open");
        setupDrawer.setAttribute("aria-hidden", "true");
        document.body.classList.remove("drawer-open");
      }
      function renderGames() {
        gamesGrid.innerHTML = "";
        const game = {
          name: "Chess",
          description:
            "The classic two-player strategy game of kings, queens, and tactical manoeuvring.",
          image: "images/cover/chess.jpg",
          players: { min: 2, max: 2 },
        };
        const card = document.createElement("article");
        card.className = "game-card";
        const image = document.createElement("div");
        image.className = "game-image";
        const img = document.createElement("img");
        img.src = game.image;
        img.alt = "Chess preview";
        img.onerror = () => {
          img.remove();
          const p = document.createElement("div");
          p.className = "placeholder-image";
          p.textContent = "♟";
          image.appendChild(p);
        };
        image.appendChild(img);
        const c = document.createElement("div");
        c.className = "game-content";
        c.innerHTML =
          '<h2>Chess</h2><p class="description">The classic two-player strategy game of kings, queens, and tactical manoeuvring.</p><div class="game-meta"><span class="meta-tag">2 players</span><span class="meta-tag">Standard Chess</span><span class="meta-tag">Online</span><span class="meta-tag">Computer</span></div>';
        const b = document.createElement("button");
        b.className = "play-button";
        b.textContent = "Play";
        b.onclick = openSetup;
        c.appendChild(b);
        card.append(image, c);
        gamesGrid.appendChild(card);
      }
      function renderProfiles() {
        profileList.innerHTML = "";
        profiles.forEach((p) => {
          const row = document.createElement("div");
          row.className = "profile-row";
          row.innerHTML = `<div class="avatar">${escapeHtml(p.avatar)}</div><div class="grow"><div class="player-name">${escapeHtml(p.name)}</div><div class="player-type">Local player</div></div>`;
          const edit = document.createElement("button");
          edit.className = "small";
          edit.textContent = "Edit";
          edit.onclick = () => openEditor(p.id);
          row.appendChild(edit);
          if (profiles.length > 1) {
            const remove = document.createElement("button");
            remove.className = "small danger";
            remove.textContent = "×";
            remove.onclick = () => removeProfile(p.id);
            row.appendChild(remove);
          }
          profileList.appendChild(row);
        });
      }
      function escapeHtml(v) {
        return String(v).replace(
          /[&<>\"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }
      function openEditor(profileId = null) {
        editingProfileId = profileId;
        const p = profiles.find((x) => x.id === profileId) || {
          id: null,
          name: "Player",
          avatar: AVATARS[profiles.length % AVATARS.length],
        };
        profileEditor.innerHTML = `<div style="margin-top:9px;padding:10px;background:var(--panel2);border:1px solid var(--border);border-radius:8px"><input id="profileNameInput" value="${escapeHtml(p.name)}" maxlength="30" style="width:100%;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:8px"><div style="display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:8px" id="avatarChoices"></div><div class="row" style="margin-top:8px"><button id="saveProfile" class="small primary">Save</button><button id="cancelProfile" class="small">Cancel</button></div></div>`;
        const choices = document.getElementById("avatarChoices");
        AVATARS.forEach((a) => {
          const x = document.createElement("button");
          x.className = "small";
          x.textContent = a;
          x.onclick = () => {
            document.getElementById("profileNameInput").dataset.avatar = a;
          };
          choices.appendChild(x);
        });
        document.getElementById("profileNameInput").dataset.avatar = p.avatar;
        document.getElementById("saveProfile").onclick = () => {
          const name =
            document.getElementById("profileNameInput").value.trim() ||
            "Player";
          if (editingProfileId) {
            const existing = profiles.find((x) => x.id === editingProfileId);
            existing.name = name;
            existing.avatar =
              document.getElementById("profileNameInput").dataset.avatar ||
              existing.avatar;
          } else {
            profiles.push({
              id: id(),
              name,
              avatar:
                document.getElementById("profileNameInput").dataset.avatar ||
                "♟",
            });
          }
          saveProfiles();
          renderProfiles();
          profileEditor.innerHTML = "";
          sendIdentify();
          renderSetup();
        };
        document.getElementById("cancelProfile").onclick = () => {
          profileEditor.innerHTML = "";
        };
      }
      function removeProfile(profileId) {
        if (profiles.length <= 1) return;
        profiles = profiles.filter((p) => p.id !== profileId);
        saveProfiles();
        renderProfiles();
        sendIdentify();
        renderSetup();
      }
      function renderOnline() {
        onlineCodeDisplay.hidden = !onlineState.code;
        onlineCode.textContent = onlineState.code || "";
        const ps = onlineState.participants.filter((p) => p.connected);
        onlineParticipants.innerHTML = "";
        if (!ps.length) {
          onlineParticipants.innerHTML =
            '<div class="muted">Create or join a room to see connected players.</div>';
        } else
          ps.forEach((p) => {
            const row = document.createElement("div");
            row.className = "player-row";
            row.innerHTML = `<div class="avatar">${escapeHtml(p.avatar || "🎮")}</div><div class="grow"><div class="player-name">${escapeHtml(p.name || "Player")}</div><div class="player-type">${p.clientId === onlineState.clientId ? "You • " : ""}${p.role === "host" ? "Host" : "Online player"}</div></div>`;
            onlineParticipants.appendChild(row);
          });
        if (onlineState.connected) {
          onlineCodeStatus.textContent = `Connected • ${ps.length} player${ps.length === 1 ? "" : "s"}`;
          onlineCodeStatus.classList.add("ok");
        } else {
          onlineCodeStatus.textContent = roomCode()
            ? `Room ${roomCode()}`
            : "Not connected";
          onlineCodeStatus.classList.remove("ok");
        }
        renderSetup();
      }
      function renderSetup() {
        renderProfiles();
        setupPlayers.innerHTML = "";
        const me = onlineState.participants.find(
          (p) => p.clientId === onlineState.clientId,
        );
        const remote = onlineState.participants.find(
          (p) =>
            p.connected && p.clientId !== onlineState.clientId && !p.spectator,
        );
        const host = onlineState.participants.find(
          (p) => p.connected && p.role === "host",
        );
        let white, black;
        if (onlineState.connected && onlineState.isHost) {
          white = {
            name: profiles[0]?.name || "Host",
            avatar: profiles[0]?.avatar || "♟",
            type: "You • White",
          };
          black = remote
            ? {
                name: remote.name,
                avatar: remote.avatar,
                type: "Online player • Black",
              }
            : { name: "Computer", avatar: "🤖", type: "Computer • Black" };
        } else if (onlineState.connected && !onlineState.isHost) {
          white = host
            ? { name: host.name, avatar: host.avatar, type: "Host • White" }
            : { name: "Host", avatar: "♟", type: "Host • White" };
          black = {
            name: profiles[0]?.name || "Player",
            avatar: profiles[0]?.avatar || "♟",
            type: "You • Black",
          };
        } else {
          white = {
            name: profiles[0]?.name || "Player 1",
            avatar: profiles[0]?.avatar || "♟",
            type: "Local • White",
          };
          black = { name: "Computer", avatar: "🤖", type: "Computer • Black" };
        }
        for (const [seat, p] of [
          ["White", white],
          ["Black", black],
        ]) {
          const row = document.createElement("div");
          row.className = "setup-slot";
          row.innerHTML = `<div class="seat">${seat}</div><div class="avatar">${escapeHtml(p.avatar)}</div><div class="grow"><div class="player-name">${escapeHtml(p.name)}</div><div class="player-type">${escapeHtml(p.type)}</div></div>`;
          setupPlayers.appendChild(row);
        }
        if (onlineState.connected && !onlineState.isHost) {
          setupHint.textContent =
            "The host controls the game setup and starts the game.";
          playButton.disabled = true;
        } else if (onlineState.connected && !remote) {
          setupHint.textContent =
            "No other player is connected yet. The game will use the computer until another player joins.";
          playButton.disabled = false;
        } else {
          setupHint.textContent = onlineState.connected
            ? "The connected player will take Black. Both screens will open the game when the host starts it."
            : "Play locally against the computer.";
          playButton.disabled = false;
        }
      }
      function wsUrl(code, token, role) {
        const base = ONLINE_SERVER_URL.replace(/^http/i, "ws").replace(
          /\/$/,
          "",
        );
        const q = new URLSearchParams({
          clientId: onlineState.clientId || id(),
          role,
        });
        if (token) q.set("token", token);
        return `${base}/ws/${encodeURIComponent(code)}?${q}`;
      }
      function closeSocket() {
        if (onlineState.socket) {
          try {
            onlineState.socket.close();
          } catch {}
        }
        onlineState.socket = null;
        onlineState.connected = false;
        onlineState.isHost = false;
        onlineState.participants = [];
        renderOnline();
      }
      function sendIdentify() {
        if (
          !onlineState.socket ||
          onlineState.socket.readyState !== WebSocket.OPEN
        )
          return;
        const p = profiles[0] || { id: "", name: "Player", avatar: "♟" };
        onlineState.socket.send(
          JSON.stringify({
            type: "player:identify",
            profileId: p.id,
            name: p.name,
            avatar: p.avatar,
            spectator: false,
          }),
        );
      }
      function connectRoom(code, { host = false } = {}) {
        if (!configured()) {
          error("Set ONLINE_SERVER_URL in index.html first.");
          return;
        }
        if (!code) {
          error("No room code.");
          return;
        }
        closeSocket();
        onlineState.clientId = onlineState.clientId || id();
        onlineState.isHost = host;
        persistOnline();
        onlineCodeStatus.textContent = "Connecting…";
        const ws = new WebSocket(
          wsUrl(
            code,
            host ? onlineState.hostToken : "",
            host ? "host" : "player",
          ),
        );
        onlineState.socket = ws;
        ws.onopen = () => {
          onlineState.connected = true;
          error("");
          sendIdentify();
          renderOnline();
        };
        ws.onmessage = (event) => {
          let m;
          try {
            m = JSON.parse(event.data);
          } catch {
            return;
          }
          if (m.type === "room:hello") {
            onlineState.participants = m.room?.participants || [];
            onlineState.config = m.room?.config || null;
            renderOnline();
            if (m.room?.started && m.room?.config)
              queueOnlineStart(m.room.config);
            return;
          }
          if (m.type === "room:participants") {
            onlineState.participants = Array.isArray(m.participants)
              ? m.participants
              : [];
            renderOnline();
            return;
          }
          if (m.type === "room:config") {
            onlineState.config = m.config || null;
            renderSetup();
            return;
          }
          if (m.type === "game:start") {
            onlineState.config = m.config || onlineState.config;
            if (onlineState.config) queueOnlineStart(onlineState.config);
            return;
          }
          if (m.type === "error") error(m.message || "Server error");
        };
        ws.onclose = () => {
          if (onlineState.socket === ws) {
            onlineState.connected = false;
            onlineState.socket = null;
            renderOnline();
          }
        };
        ws.onerror = () => {
          if (onlineState.socket === ws)
            error(
              "Could not connect to the multiplayer server. Check the Worker URL and deployment.",
            );
        };
      }
      function queueOnlineStart(config) {
        sessionStorage.setItem(
          "gameLibraryOnlineConfig",
          JSON.stringify(config),
        );
        const params = new URLSearchParams({
          online: "1",
          code: roomCode(),
          server: ONLINE_SERVER_URL,
          clientId: onlineState.clientId,
          hostToken: onlineState.hostToken,
        });
        window.location.href = `chess/chess.html?${params}`;
      }
      async function createRoom() {
        error("");
        if (!configured()) {
          error(
            "Replace YOUR-WORKER-URL in ONLINE_SERVER_URL with your Worker URL.",
          );
          return;
        }
        requestOnlineCodeButton.disabled = true;
        try {
          closeSocket();
          onlineCodeStatus.textContent = "Creating room…";
          const p = profiles[0] || { name: "Host", avatar: "♟" };
          const body = JSON.stringify({
            hostName: p.name,
            hostAvatar: p.avatar,
          });
          let response = await fetch(
            `${ONLINE_SERVER_URL.replace(/\/$/, "")}/api/rooms`,
            {
              method: "POST",
              headers: { "Content-Type": "text/plain;charset=UTF-8" },
              body,
            },
          );
          if (response.status === 405) {
            response = await fetch(
              `${ONLINE_SERVER_URL.replace(/\/$/, "")}/api/rooms/new?hostName=${encodeURIComponent(p.name)}&hostAvatar=${encodeURIComponent(p.avatar)}`,
            );
          }
          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data.code || !data.hostToken)
            throw new Error(
              data.error || `Server returned HTTP ${response.status}.`,
            );
          onlineState.code = String(data.code);
          onlineState.joinedCode = "";
          onlineState.hostToken = String(data.hostToken);
          onlineState.clientId = onlineState.clientId || id();
          onlineState.config = null;
          persistOnline();
          renderOnline();
          connectRoom(onlineState.code, { host: true });
        } catch (e) {
          error(e.message || String(e));
          onlineCodeStatus.textContent = "Room creation failed";
        } finally {
          requestOnlineCodeButton.disabled = false;
        }
      }
      async function joinRoom() {
        error("");
        const code = joinOnlineCode.value.replace(/\D/g, "").slice(0, 4);
        joinOnlineCode.value = code;
        if (code.length !== 4) {
          error("Enter a 4-digit room code.");
          return;
        }
        if (!configured()) {
          error(
            "Replace YOUR-WORKER-URL in ONLINE_SERVER_URL with your Worker URL.",
          );
          return;
        }
        joinOnlineGroupButton.disabled = true;
        try {
          closeSocket();
          onlineState.code = "";
          onlineState.joinedCode = code;
          onlineState.hostToken = "";
          onlineState.config = null;
          onlineState.clientId = onlineState.clientId || id();
          persistOnline();
          connectRoom(code, { host: false });
        } catch (e) {
          error(e.message || String(e));
        } finally {
          joinOnlineGroupButton.disabled = false;
        }
      }
      function buildOnlineConfig() {
        const remote = onlineState.participants.find(
          (p) =>
            p.connected && p.clientId !== onlineState.clientId && !p.spectator,
        );
        const p = profiles[0] || { id: "", name: "Player", avatar: "♟" };
        return {
          game: "chess",
          variant: "standard",
          hostClientId: onlineState.clientId,
          players: [
            {
              seat: "white",
              clientId: onlineState.clientId,
              name: p.name,
              avatar: p.avatar,
              type: "human",
            },
            ...(remote
              ? [
                  {
                    seat: "black",
                    clientId: remote.clientId,
                    name: remote.name,
                    avatar: remote.avatar,
                    type: "human",
                  },
                ]
              : [
                  {
                    seat: "black",
                    clientId: "computer",
                    name: "Computer",
                    avatar: "🤖",
                    type: "computer",
                    difficulty: "normal",
                  },
                ]),
          ],
          hostComputers: !remote,
        };
      }
      function play() {
        if (!onlineState.connected) {
          const config = {
            game: "chess",
            variant: "standard",
            hostClientId: null,
            players: [
              {
                seat: "white",
                clientId: null,
                name: profiles[0]?.name || "Player 1",
                avatar: profiles[0]?.avatar || "♟",
                type: "human",
              },
              {
                seat: "black",
                clientId: "computer",
                name: "Computer",
                avatar: "🤖",
                type: "computer",
                difficulty: "normal",
              },
            ],
          };
          sessionStorage.setItem(
            "gameLibraryOnlineConfig",
            JSON.stringify(config),
          );
          window.location.href = "chess/chess.html";
          return;
        }
        if (!onlineState.isHost) return;
        const remote = onlineState.participants.find(
          (p) =>
            p.connected && p.clientId !== onlineState.clientId && !p.spectator,
        );
        const config = buildOnlineConfig();
        if (!remote && onlineState.code) {
          onlineState.config = config;
          onlineState.socket.send(
            JSON.stringify({ type: "room:config", config }),
          );
          onlineState.socket.send(JSON.stringify({ type: "game:start" }));
          return;
        }
        onlineState.config = config;
        onlineState.socket.send(
          JSON.stringify({ type: "room:config", config }),
        );
        onlineState.socket.send(JSON.stringify({ type: "game:start" }));
      }
      playersButton.onclick = openSetup;
      closeSetup.onclick = closeSetupDrawer;
      backdrop.onclick = closeSetupDrawer;
      requestOnlineCodeButton.onclick = createRoom;
      joinOnlineGroupButton.onclick = joinRoom;
      disconnectOnlineButton.onclick = () => {
        closeSocket();
        onlineState.code = "";
        onlineState.joinedCode = "";
        onlineState.hostToken = "";
        persistOnline();
        renderOnline();
      };
      playButton.onclick = play;
      addProfileButton.onclick = () => openEditor();
      joinOnlineCode.addEventListener(
        "input",
        () =>
          (joinOnlineCode.value = joinOnlineCode.value
            .replace(/\D/g, "")
            .slice(0, 4)),
      );
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeSetupDrawer();
      });
      renderGames();
      renderOnline();
    </script>
  </body>
</html>
