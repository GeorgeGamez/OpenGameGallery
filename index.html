<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Library</title>
    <style>
      :root {
        --bg: #17191f;
        --panel: #22252d;
        --panel2: #2b2f39;
        --text: #f1f3f5;
        --muted: #aeb4c0;
        --accent: #78a9ff;
        --border: #3a3f4a;
        --ok: #86d89a;
        --danger: #e07a7a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      button,
      input {
        font: inherit;
      }
      button {
        color: var(--text);
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 13px;
        cursor: pointer;
      }
      button:hover {
        background: #353a45;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      header {
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
        background: #1d2027;
      }
      header > div,
      main {
        max-width: 1100px;
        margin: auto;
      }
      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 30px;
      }
      header p {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 15px;
      }
      .top-tab {
        background: var(--panel2);
      }
      main {
        padding: 24px;
      }
      .games-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 18px;
      }
      .game-card {
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .game-image {
        width: 100%;
        aspect-ratio: 16/9;
        display: grid;
        place-items: center;
        background: #111318;
        overflow: hidden;
      }
      .game-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .placeholder-image {
        font-size: 72px;
      }
      .game-content {
        padding: 17px;
        display: flex;
        flex-direction: column;
        flex: 1;
      }
      .game-content h2 {
        margin: 0;
        font-size: 20px;
      }
      .description {
        margin: 7px 0 15px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }
      .game-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 16px;
      }
      .meta-tag {
        padding: 4px 7px;
        color: var(--muted);
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 5px;
        font-size: 11px;
      }
      .play-button {
        width: 100%;
        margin-top: auto;
        color: #111318;
        background: var(--accent);
        border: 0;
        border-radius: 7px;
        padding: 10px 14px;
        font-weight: 700;
      }
      .drawer-backdrop {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(0, 0, 0, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s;
      }
      .drawer-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 21;
        width: min(500px, 100vw);
        background: var(--panel);
        border-left: 1px solid var(--border);
        transform: translateX(100%);
        transition: transform 0.2s ease;
        display: flex;
        flex-direction: column;
      }
      .drawer.open {
        transform: translateX(0);
      }
      .drawer-header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 18px;
        border-bottom: 1px solid var(--border);
      }
      .drawer-header h2 {
        margin: 0;
        font-size: 19px;
      }
      .drawer-header p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .drawer-body {
        padding: 18px;
        overflow: auto;
        flex: 1;
      }
      .drawer-footer {
        padding: 14px 18px;
        border-top: 1px solid var(--border);
        display: flex;
      }
      .drawer-footer button {
        width: 100%;
      }
      .section {
        padding: 14px 0;
        border-bottom: 1px solid var(--border);
      }
      .section:first-child {
        padding-top: 0;
      }
      .section:last-child {
        border-bottom: 0;
      }
      .section h3 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .grow {
        flex: 1;
      }
      .profile-list,
      .players-list,
      .setup-players {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .profile-row,
      .player-row,
      .setup-slot {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .avatar {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--bg);
        font-size: 20px;
        flex: 0 0 34px;
      }
      .player-info {
        min-width: 0;
      }
      .player-name {
        font-weight: 700;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .player-type {
        color: var(--muted);
        font-size: 11px;
      }
      .online-box {
        background: #1b1e24;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 12px;
      }
      .online-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .online-code {
        margin-top: 10px;
        text-align: center;
        padding: 13px;
        border: 1px dashed var(--accent);
        border-radius: 8px;
        background: #1a2030;
      }
      .online-code strong {
        display: block;
        font-size: 30px;
        letter-spacing: 6px;
      }
      .online-code span {
        color: var(--muted);
        font-size: 11px;
      }
      .online-code[hidden] {
        display: none;
      }
      .join-row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .join-row input {
        flex: 1;
        min-width: 0;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 10px;
        text-align: center;
        letter-spacing: 3px;
      }
      .status-line {
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
      }
      .status-line.ok {
        color: var(--ok);
      }
      .error {
        margin-top: 9px;
        color: #ffb4b4;
        background: #321f24;
        border: 1px solid #63353d;
        border-radius: 7px;
        padding: 8px;
        font-size: 12px;
      }
      .error[hidden] {
        display: none;
      }
      .debug-panel {
        margin-top: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #16181d;
        overflow: hidden;
      }
      .debug-panel summary {
        cursor: pointer;
        padding: 8px 10px;
        color: var(--muted);
        font-size: 12px;
      }
      .debug-body {
        padding: 10px;
        border-top: 1px solid var(--border);
      }
      .debug-output {
        margin: 0;
        max-height: 260px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font:
          11px/1.45 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: #d9dee7;
      }
      .debug-button {
        width: 100%;
        margin-bottom: 9px;
      }
      .seat {
        font-weight: 700;
        width: 52px;
      }
      .setup-slot .avatar {
        flex-basis: 34px;
      }
      .primary {
        background: var(--accent);
        color: #111318;
        border-color: transparent;
        font-weight: 700;
      }
      .small {
        padding: 6px 9px;
        font-size: 12px;
      }
      @media (max-width: 650px) {
        main {
          padding: 14px;
        }
        .online-actions {
          grid-template-columns: 1fr;
        }
        .drawer {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div class="header-row">
          <div>
            <h1>Game Library</h1>
            <p>Standard Chess — local, computer, and online play</p>
          </div>
          <button id="playersButton" class="top-tab">
            Players &amp; Online
          </button>
        </div>
      </div>
    </header>
    <main><div id="gamesGrid" class="games-grid"></div></main>
    <div id="backdrop" class="drawer-backdrop"></div>
    <aside id="setupDrawer" class="drawer" aria-hidden="true">
      <div class="drawer-header">
        <div>
          <h2>Chess setup</h2>
          <p>Standard Chess</p>
        </div>
        <button id="closeSetup" class="small" aria-label="Close">×</button>
      </div>
      <div class="drawer-body">
        <section class="section">
          <h3>Players</h3>
          <div class="setup-players" id="setupPlayers"></div>
          <div class="muted" id="setupHint" style="margin-top: 9px"></div>
        </section>
        <section class="section">
          <h3>Online group</h3>
          <div class="online-box">
            <div class="online-actions">
              <button id="requestOnlineCode" class="primary">Create room</button
              ><button id="disconnectOnline">Disconnect</button>
            </div>
            <div id="onlineCodeDisplay" class="online-code" hidden>
              <span>ROOM CODE</span><strong id="onlineCode"></strong>
            </div>
            <div class="join-row">
              <input
                id="joinOnlineCode"
                inputmode="numeric"
                maxlength="4"
                placeholder="4-digit code"
                aria-label="Room code"
              /><button id="joinOnlineGroup" class="small">Join</button>
            </div>
            <div id="onlineCodeStatus" class="status-line">Not connected</div>
            <div style="margin-top: 10px">
              <div class="muted" style="margin-bottom: 7px">
                Connected players
              </div>
              <div id="onlineParticipants" class="players-list"></div>
            </div>
            <div id="onlineError" class="error" hidden></div>
            <details class="debug-panel">
              <summary>Connection diagnostics</summary>
              <div class="debug-body">
                <button id="runDiagnostics" class="small debug-button">
                  Run diagnostics
                </button>
                <pre id="debugOutput" class="debug-output">
No diagnostics run yet.</pre
                >
              </div>
            </details>
          </div>
        </section>
        <section class="section">
          <h3>Local profile</h3>
          <div class="muted" style="margin-bottom: 9px">
            The first profile on this device controls the local player.
          </div>
          <div id="profileList" class="profile-list"></div>
          <button
            id="addProfile"
            class="small"
            style="margin-top: 9px; width: 100%"
          >
            + Add profile
          </button>
          <div id="profileEditor"></div>
        </section>
      </div>
      <div class="drawer-footer">
        <button id="playButton" class="primary">Play</button>
      </div>
    </aside>
    <script>
      "use strict";
      const RAW_ONLINE_SERVER_URL =
        "https://opengamegallery.george-arps.workers.dev";
      const $ = (id) => document.getElementById(id);
      const gamesGrid = $("gamesGrid"),
        playersButton = $("playersButton"),
        backdrop = $("backdrop"),
        setupDrawer = $("setupDrawer"),
        closeSetup = $("closeSetup"),
        setupPlayers = $("setupPlayers"),
        setupHint = $("setupHint"),
        playButton = $("playButton"),
        requestOnlineCodeButton = $("requestOnlineCode"),
        disconnectOnlineButton = $("disconnectOnline"),
        onlineCodeDisplay = $("onlineCodeDisplay"),
        onlineCode = $("onlineCode"),
        onlineCodeStatus = $("onlineCodeStatus"),
        joinOnlineCode = $("joinOnlineCode"),
        joinOnlineGroupButton = $("joinOnlineGroup"),
        onlineParticipants = $("onlineParticipants"),
        onlineError = $("onlineError"),
        profileList = $("profileList"),
        addProfileButton = $("addProfile"),
        profileEditor = $("profileEditor"),
        runDiagnosticsButton = $("runDiagnostics"),
        debugOutput = $("debugOutput");
      let profiles = loadProfiles(),
        editingProfileId = null;
      const onlineState = {
        code: localStorage.getItem("gameLibraryOnlineCode") || "",
        joinedCode: localStorage.getItem("gameLibraryOnlineJoinedCode") || "",
        hostToken: localStorage.getItem("gameLibraryOnlineHostToken") || "",
        clientId: localStorage.getItem("gameLibraryOnlineClientId") || "",
        connected: false,
        isHost: false,
        socket: null,
        participants: [],
        config: null,
      };
      const AVATARS = [
        "♟",
        "♞",
        "♜",
        "♛",
        "♚",
        "⚔",
        "🎲",
        "★",
        "◆",
        "●",
        "▲",
        "■",
        "☀",
        "☾",
        "⚙",
        "🎮",
      ];
      function id() {
        return "client_" + Math.random().toString(36).slice(2, 12);
      }
      function escapeHtml(v) {
        return String(v).replace(
          /[&<>\"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }
      function loadProfiles() {
        try {
          const p = JSON.parse(
            localStorage.getItem("gameLibraryProfiles") || "null",
          );
          if (Array.isArray(p) && p.length) return p;
        } catch {}
        return [
          {
            id: "p_" + Math.random().toString(36).slice(2, 10),
            name: "Player 1",
            avatar: "♟",
          },
        ];
      }
      function saveProfiles() {
        localStorage.setItem("gameLibraryProfiles", JSON.stringify(profiles));
      }
      function configured() {
        return (
          RAW_ONLINE_SERVER_URL &&
          !RAW_ONLINE_SERVER_URL.includes("YOUR-WORKER-URL") &&
          RAW_ONLINE_SERVER_URL.trim().length > 0
        );
      }
      function serverBase() {
        let u = RAW_ONLINE_SERVER_URL.trim();
        if (!/^https?:\/\//i.test(u)) {
          u = "https://" + u;
        }
        u = u.replace(/\/+$/, "");
        u = u.replace(/\/(?:api\/rooms(?:\/[^/]+)?|api|ws(?:\/[^/]+)?)$/i, "");
        return u;
      }
      function roomCode() {
        return onlineState.code || onlineState.joinedCode || "";
      }
      function persistOnline() {
        localStorage.setItem("gameLibraryOnlineClientId", onlineState.clientId);
        if (onlineState.code)
          localStorage.setItem("gameLibraryOnlineCode", onlineState.code);
        else localStorage.removeItem("gameLibraryOnlineCode");
        if (onlineState.hostToken)
          localStorage.setItem(
            "gameLibraryOnlineHostToken",
            onlineState.hostToken,
          );
        else localStorage.removeItem("gameLibraryOnlineHostToken");
        if (onlineState.joinedCode)
          localStorage.setItem(
            "gameLibraryOnlineJoinedCode",
            onlineState.joinedCode,
          );
        else localStorage.removeItem("gameLibraryOnlineJoinedCode");
      }
      function error(msg) {
        onlineError.textContent = msg || "";
        onlineError.hidden = !msg;
      }
      function closeSocket() {
        if (onlineState.socket) {
          try {
            onlineState.socket.close();
          } catch {}
        }
        onlineState.socket = null;
        onlineState.connected = false;
        onlineState.isHost = false;
        onlineState.participants = [];
      }
      function renderProfiles() {
        profileList.innerHTML = "";
        for (const p of profiles) {
          const row = document.createElement("div");
          row.className = "profile-row";
          row.innerHTML = `<div class="avatar">${escapeHtml(p.avatar || "♟")}</div><div class="grow"><div class="player-name">${escapeHtml(p.name)}</div><div class="player-type">Local profile</div></div>`;
          profileList.appendChild(row);
        }
      }
      function openProfileEditor(profileId = null) {
        editingProfileId = profileId;
        const p = profiles.find((x) => x.id === profileId) || {
          name: "Player",
          avatar: "♟",
        };
        profileEditor.innerHTML = `<div style="margin-top:9px;padding:10px;background:var(--panel2);border:1px solid var(--border);border-radius:8px"><input id="profileNameInput" maxlength="30" value="${escapeHtml(p.name)}" style="width:100%;padding:8px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text)"><div id="avatarChoices" style="display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:8px"></div><div class="row" style="margin-top:8px"><button id="saveProfile" class="small primary">Save</button><button id="cancelProfile" class="small">Cancel</button></div></div>`;
        const choices = $("avatarChoices");
        for (const a of AVATARS) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "small";
          b.textContent = a;
          b.onclick = () => ($("profileNameInput").dataset.avatar = a);
          choices.appendChild(b);
        }
        $("profileNameInput").dataset.avatar = p.avatar || "♟";
        $("saveProfile").onclick = () => {
          const name = $("profileNameInput").value.trim() || "Player";
          const avatar = $("profileNameInput").dataset.avatar || "♟";
          if (editingProfileId) {
            const x = profiles.find((y) => y.id === editingProfileId);
            if (x) {
              x.name = name;
              x.avatar = avatar;
            }
          } else
            profiles.push({
              id: "p_" + Math.random().toString(36).slice(2, 10),
              name,
              avatar,
            });
          saveProfiles();
          profileEditor.innerHTML = "";
          renderProfiles();
          sendIdentify();
          renderSetup();
        };
        $("cancelProfile").onclick = () => (profileEditor.innerHTML = "");
      }
      function openSetup() {
        setupDrawer.classList.add("open");
        backdrop.classList.add("open");
        setupDrawer.setAttribute("aria-hidden", "false");
        renderSetup();
        renderOnline();
      }
      function renderGames() {
        gamesGrid.innerHTML = "";
        const card = document.createElement("article");
        card.className = "game-card";
        const image = document.createElement("div");
        image.className = "game-image";
        const img = document.createElement("img");
        img.src = "images/cover/chess.jpg";
        img.alt = "Chess preview";
        img.onerror = () => {
          img.remove();
          const p = document.createElement("div");
          p.className = "placeholder-image";
          p.textContent = "♟";
          image.appendChild(p);
        };
        image.appendChild(img);
        const content = document.createElement("div");
        content.className = "game-content";
        content.innerHTML =
          '<h2>Chess</h2><p class="description">The classic two-player strategy game.</p><div class="game-meta"><span class="meta-tag">2 players</span><span class="meta-tag">Standard Chess</span><span class="meta-tag">Local / Online</span></div><button class="play-button">Set up &amp; Play</button>';
        content.querySelector("button").onclick = openSetup;
        card.append(image, content);
        gamesGrid.appendChild(card);
      }
      function renderSetup() {
        renderProfiles();
        setupPlayers.innerHTML = "";
        const host = onlineState.participants.find(
          (p) => p.connected && p.role === "host",
        );
        const remote = onlineState.participants.find(
          (p) =>
            p.connected && p.clientId !== onlineState.clientId && !p.spectator,
        );
        let white, black;
        if (onlineState.connected && onlineState.isHost) {
          white = {
            name: profiles[0]?.name || "Player 1",
            avatar: profiles[0]?.avatar || "♟",
            type: "You • White",
          };
          black = remote
            ? {
                name: remote.name,
                avatar: remote.avatar,
                type: "Online player • Black",
              }
            : { name: "Waiting for player…", avatar: "…", type: "Waiting" };
        } else if (onlineState.connected && !onlineState.isHost) {
          white = {
            name: host?.name || "Host",
            avatar: host?.avatar || "♟",
            type: "Host • White",
          };
          black = {
            name: profiles[0]?.name || "Player 1",
            avatar: profiles[0]?.avatar || "♟",
            type: "You • Black",
          };
        } else {
          white = {
            name: profiles[0]?.name || "Player 1",
            avatar: profiles[0]?.avatar || "♟",
            type: "Local • White",
          };
          black = { name: "Computer", avatar: "🤖", type: "Computer • Black" };
        }
        for (const [seat, p] of [
          ["White", white],
          ["Black", black],
        ]) {
          const row = document.createElement("div");
          row.className = "setup-slot";
          row.innerHTML = `<div class="seat">${seat}</div><div class="avatar">${escapeHtml(p.avatar)}</div><div class="grow"><div class="player-name">${escapeHtml(p.name)}</div><div class="player-type">${escapeHtml(p.type)}</div></div>`;
          setupPlayers.appendChild(row);
        }
        if (onlineState.connected && !onlineState.isHost) {
          setupHint.textContent = "Waiting for the host to start the game.";
          playButton.disabled = true;
        } else if (onlineState.connected && !remote) {
          setupHint.textContent =
            "Waiting for another player to join this room.";
          playButton.disabled = true;
        } else if (onlineState.connected) {
          setupHint.textContent =
            "Both players are connected. The host can start the game.";
          playButton.disabled = false;
        } else {
          setupHint.textContent =
            "Play locally against the computer, or create/join an online room.";
          playButton.disabled = false;
        }
      }
      function renderOnline() {
        onlineCodeDisplay.hidden = !onlineState.code;
        onlineCode.textContent = onlineState.code || "";
        const ps = onlineState.participants.filter((p) => p.connected);
        onlineParticipants.innerHTML = "";
        if (!ps.length)
          onlineParticipants.innerHTML =
            '<div class="muted">No connected players yet.</div>';
        else
          for (const p of ps) {
            const row = document.createElement("div");
            row.className = "player-row";
            row.innerHTML = `<div class="avatar">${escapeHtml(p.avatar || "🎮")}</div><div class="grow"><div class="player-name">${escapeHtml(p.name || "Player")}</div><div class="player-type">${p.clientId === onlineState.clientId ? "You • " : ""}${p.role === "host" ? "Host" : "Online player"}</div></div>`;
            onlineParticipants.appendChild(row);
          }
        if (onlineState.connected) {
          onlineCodeStatus.textContent = `Connected • ${ps.length} player${ps.length === 1 ? "" : "s"}`;
          onlineCodeStatus.classList.add("ok");
        } else {
          onlineCodeStatus.textContent = roomCode()
            ? `Room ${roomCode()}`
            : "Not connected";
          onlineCodeStatus.classList.remove("ok");
        }
        renderSetup();
      }
      function setDebug(text) {
        debugOutput.textContent = text;
      }
      async function readResponse(response) {
        const body = await response.text();
        const headers = {};
        for (const [k, v] of response.headers.entries()) headers[k] = v;
        return {
          status: response.status,
          statusText: response.statusText,
          headers,
          body: body.slice(0, 4000),
        };
      }
      async function probeFetch(label, url, options = {}) {
        const started = performance.now();
        try {
          const response = await fetch(url, options);
          const info = await readResponse(response);
          return {
            label,
            url,
            ms: Math.round(performance.now() - started),
            ok: response.ok,
            ...info,
          };
        } catch (e) {
          return {
            label,
            url,
            ms: Math.round(performance.now() - started),
            networkError: String(e),
          };
        }
      }
      async function runDiagnostics() {
        if (!configured()) {
          setDebug(
            `ONLINE_SERVER_URL is not configured.\n\nCurrent value: ${RAW_ONLINE_SERVER_URL}`,
          );
          return;
        }
        runDiagnosticsButton.disabled = true;
        const base = serverBase();
        const body = JSON.stringify({
          hostName: "Diagnostics",
          hostAvatar: "🛠",
          config: { game: "chess", variant: "standard" },
        });
        const results = [];
        results.push(await probeFetch("Worker root", base));
        results.push(await probeFetch("Debug endpoint", `${base}/api/debug`));
        results.push(
          await probeFetch("OPTIONS /api/rooms", `${base}/api/rooms`, {
            method: "OPTIONS",
          }),
        );
        results.push(
          await probeFetch("POST /api/rooms", `${base}/api/rooms`, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=UTF-8" },
            body,
          }),
        );
        let wsResult = {
          label: "WebSocket",
          url: `${wsBaseForDiagnostics(base)}/ws/0000?clientId=diagnostics&role=player`,
        };
        try {
          const testUrl =
            wsBaseForDiagnostics(base) +
            "/ws/0000?clientId=diagnostics&role=player";
          const ws = new WebSocket(testUrl);
          await new Promise((resolve) => {
            let done = false;
            const finish = (x) => {
              if (done) return;
              done = true;
              clearTimeout(timer);
              resolve(x);
            };
            const timer = setTimeout(() => finish({ state: "timeout" }), 3500);
            ws.onopen = () => finish({ state: "open" });
            ws.onclose = (e) =>
              finish({ state: "closed", code: e.code, reason: e.reason });
            ws.onerror = () => finish({ state: "error" });
          });
          try {
            ws.close();
          } catch {}
          wsResult = { label: "WebSocket", url: testUrl, result: wsResult };
        } catch (e) {
          wsResult = { ...wsResult, error: String(e) };
        }
        results.push(wsResult);
        setDebug(
          `Worker base: ${base}\n\n` +
            results.map((r) => JSON.stringify(r, null, 2)).join("\n\n"),
        );
        runDiagnosticsButton.disabled = false;
      }
      function wsBaseForDiagnostics(base) {
        return base.replace(/^https:/i, "wss:").replace(/^http:/i, "ws:");
      }
      function sendIdentify() {
        if (
          !onlineState.socket ||
          onlineState.socket.readyState !== WebSocket.OPEN
        )
          return;
        const p = profiles[0] || { id: "", name: "Player 1", avatar: "♟" };
        onlineState.socket.send(
          JSON.stringify({
            type: "player:identify",
            profileId: p.id,
            name: p.name,
            avatar: p.avatar,
            spectator: false,
          }),
        );
      }
      function wsUrl(code) {
        const base = serverBase().replace(
          /^https?:/i,
          location.protocol === "https:" ? "wss:" : "ws:",
        );
        const q = new URLSearchParams({
          clientId: onlineState.clientId || id(),
          role: onlineState.isHost ? "host" : "player",
        });
        if (onlineState.isHost && onlineState.hostToken)
          q.set("token", onlineState.hostToken);
        return `${base}/ws/${encodeURIComponent(code)}?${q}`;
      }
      function connectRoom(code, host) {
        if (!configured()) {
          error(
            "Set ONLINE_SERVER_URL in index.html to your Cloudflare Worker URL.",
          );
          return;
        }
        closeSocket();
        onlineState.clientId = onlineState.clientId || id();
        onlineState.isHost = !!host;
        persistOnline();
        onlineCodeStatus.textContent = "Connecting…";
        const ws = new WebSocket(wsUrl(code));
        onlineState.socket = ws;
        ws.onopen = () => {
          onlineState.connected = true;
          error("");
          sendIdentify();
          renderOnline();
        };
        ws.onmessage = (e) => {
          let m;
          try {
            m = JSON.parse(e.data);
          } catch {
            return;
          }
          switch (m.type) {
            case "room:hello":
              onlineState.participants = m.room?.participants || [];
              onlineState.config = m.room?.config || null;
              renderOnline();
              if (m.room?.started && m.room?.config) startOnline(m.room.config);
              break;
            case "room:participants":
              onlineState.participants = Array.isArray(m.participants)
                ? m.participants
                : [];
              renderOnline();
              break;
            case "room:config":
              onlineState.config = m.config || null;
              renderSetup();
              break;
            case "game:start":
              onlineState.config = m.config || onlineState.config;
              if (onlineState.config) startOnline(onlineState.config);
              break;
            case "error":
              error(m.message || "Server error");
              break;
          }
        };
        ws.onclose = () => {
          if (onlineState.socket !== ws) return;
          onlineState.connected = false;
          onlineState.socket = null;
          renderOnline();
        };
        ws.onerror = () => {
          if (onlineState.socket === ws)
            error(
              "Could not connect to the multiplayer server. Check the Worker URL and deployment.",
            );
        };
      }
      function startOnline(config) {
        sessionStorage.setItem(
          "gameLibraryOnlineConfig",
          JSON.stringify(config),
        );
        const params = new URLSearchParams({
          online: "1",
          code: roomCode(),
          server: serverBase(),
          clientId: onlineState.clientId,
        });
        if (onlineState.isHost && onlineState.hostToken)
          params.set("hostToken", onlineState.hostToken);
        window.location.href = `chess/chess.html?${params}`;
      }
      async function createRoom() {
        error("");
        if (!configured()) {
          error(
            "Replace YOUR-WORKER-URL in ONLINE_SERVER_URL with your Worker URL.",
          );
          return;
        }
        requestOnlineCodeButton.disabled = true;
        onlineCodeStatus.textContent = "Creating room…";
        const base = serverBase();
        const url = `${base}/api/rooms`;
        const body = JSON.stringify({
          hostName: profiles[0]?.name || "Player 1",
          hostAvatar: profiles[0]?.avatar || "♟",
          config: { game: "chess", variant: "standard" },
        });
        try {
          closeSocket();
          onlineState.clientId = onlineState.clientId || id();
          const started = performance.now();
          let response;
          try {
            response = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "text/plain;charset=UTF-8" },
              body,
            });
          } catch (fetchError) {
            const detail = `CREATE ROOM NETWORK ERROR\n\nURL: ${url}\nError: ${String(fetchError)}\nTime: ${new Date().toISOString()}`;
            setDebug(detail);
            throw new Error(
              `Network error contacting ${url}. See Connection diagnostics for details.`,
            );
          }
          const info = await readResponse(response);
          setDebug(
            `CREATE ROOM REQUEST\n\nURL: ${url}\nElapsed: ${Math.round(performance.now() - started)} ms\n\n${JSON.stringify(info, null, 2)}`,
          );
          if (!response.ok) {
            throw new Error(
              `Server returned HTTP ${response.status}${response.statusText ? ` (${response.statusText})` : ""}. See Connection diagnostics for the exact response.`,
            );
          }
          let data = {};
          try {
            data = JSON.parse(info.body || "{}");
          } catch {}
          if (!data.code || !data.hostToken) {
            throw new Error(
              "The Worker responded successfully, but did not return a room code and host token. See Connection diagnostics.",
            );
          }
          onlineState.code = String(data.code);
          onlineState.joinedCode = "";
          onlineState.hostToken = String(data.hostToken);
          onlineState.config = data.room?.config || null;
          persistOnline();
          connectRoom(onlineState.code, true);
        } catch (e) {
          onlineCodeStatus.textContent = "Room creation failed";
          error(e.message || String(e));
        } finally {
          requestOnlineCodeButton.disabled = false;
        }
      }
      async function joinRoom() {
        error("");
        const code = joinOnlineCode.value.replace(/\D/g, "").slice(0, 4);
        joinOnlineCode.value = code;
        if (code.length !== 4) {
          error("Enter a 4-digit room code.");
          return;
        }
        if (!configured()) {
          error(
            "Replace YOUR-WORKER-URL in ONLINE_SERVER_URL with your Cloudflare Worker URL.",
          );
          return;
        }
        joinOnlineGroupButton.disabled = true;
        try {
          onlineState.code = "";
          onlineState.joinedCode = code;
          onlineState.hostToken = "";
          onlineState.config = null;
          onlineState.clientId = onlineState.clientId || id();
          persistOnline();
          connectRoom(code, false);
        } finally {
          joinOnlineGroupButton.disabled = false;
        }
      }
      function buildOnlineConfig() {
        const remote = onlineState.participants.find(
          (p) =>
            p.connected && p.clientId !== onlineState.clientId && !p.spectator,
        );
        const p = profiles[0] || { name: "Player 1", avatar: "♟" };
        if (!remote) return null;
        return {
          game: "chess",
          variant: "standard",
          hostClientId: onlineState.clientId,
          players: [
            {
              seat: "white",
              clientId: onlineState.clientId,
              name: p.name,
              avatar: p.avatar,
              type: "human",
            },
            {
              seat: "black",
              clientId: remote.clientId,
              name: remote.name,
              avatar: remote.avatar,
              type: "human",
            },
          ],
        };
      }
      function play() {
        if (!onlineState.connected) {
          window.location.href = "chess/chess.html";
          return;
        }
        if (!onlineState.isHost) return;
        const config = buildOnlineConfig();
        if (!config) {
          error(
            "Wait for another player to connect before starting the online game.",
          );
          return;
        }
        onlineState.config = config;
        onlineState.socket.send(
          JSON.stringify({ type: "room:config", config }),
        );
        onlineState.socket.send(JSON.stringify({ type: "game:start", config }));
      }
      playersButton.onclick = openSetup;
      closeSetup.onclick = () => {
        setupDrawer.classList.remove("open");
        backdrop.classList.remove("open");
        setupDrawer.setAttribute("aria-hidden", "true");
      };
      backdrop.onclick = closeSetup.onclick;
      requestOnlineCodeButton.onclick = createRoom;
      disconnectOnlineButton.onclick = () => {
        closeSocket();
        onlineState.code = "";
        onlineState.joinedCode = "";
        onlineState.hostToken = "";
        onlineState.config = null;
        persistOnline();
        renderOnline();
      };
      joinOnlineGroupButton.onclick = joinRoom;
      runDiagnosticsButton.onclick = runDiagnostics;
      playButton.onclick = play;
      addProfileButton.onclick = () => openProfileEditor();
      joinOnlineCode.addEventListener(
        "input",
        () =>
          (joinOnlineCode.value = joinOnlineCode.value
            .replace(/\D/g, "")
            .slice(0, 4)),
      );
      renderGames();
      renderProfiles();
      renderOnline();
    </script>
  </body>
</html>
